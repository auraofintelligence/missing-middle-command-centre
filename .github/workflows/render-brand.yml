name: Prepare logo artwork
on:
  push:
    branches: [brand-mark]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    if: github.repository == 'auraofintelligence/missing-middle-command-centre'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check Pillow
      - run: python3 tools/build_brand.py
      - run: |
          git add src/brand-files.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'Render favicon and header logo from the brand master'
          git push origin HEAD:brand-mark
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test
