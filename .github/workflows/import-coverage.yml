name: Build national coverage data
on:
  push:
    branches: [national-coverage]
    paths: [tools/build_coverage.py, .github/workflows/import-coverage.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    if: github.repository == 'auraofintelligence/missing-middle-command-centre'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "pyshp==2.3.1" "shapely==2.1.2"
      - run: python tools/build_coverage.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/coverage-data.mjs
          git diff --cached --quiet || git commit -m 'Build 2021 ABS national coverage dataset'
          git push origin HEAD:national-coverage
